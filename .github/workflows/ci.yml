---
name: "CI"
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Check readmes are up to date"
        run: |
          rake readme

          if git diff --exit-code; then
            echo "✅ readmes up to date"
          else
            echo '❌ readmes not up to date, run `rake readme` and commit the changes'
            exit 1
          fi
